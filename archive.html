<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive — Ahmad Qaddura</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Modern Archive Enhancements (Lightweight & Self-Contained) */
        .archive-search {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-line, #d4d4d4);
            background: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--ink-black, #111);
            margin-bottom: 24px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }
        .archive-search:focus {
            outline: none;
            border-color: var(--ink-black, #111);
        }

        /* Year & Month Accordion */
        .year-group {
            margin-bottom: 6px;
        }
        .year-btn, .month-btn, .all-btn {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: none;
            border: none;
            padding: 7px 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--ink-black, #111);
            text-align: left;
            transition: background-color 0.15s ease, color 0.15s ease;
            border-radius: 2px;
        }
        .year-btn {
            font-weight: 600;
        }
        .year-btn:hover, .month-btn:hover, .all-btn:hover {
            background-color: rgba(0, 0, 0, 0.04);
        }
        .year-btn.active, .month-btn.active, .all-btn.active {
            background-color: var(--ink-black, #111);
            color: #fff;
        }
        .year-arrow {
            display: inline-block;
            font-size: 0.75rem;
            margin-right: 6px;
            transition: transform 0.2s ease;
        }
        .year-group.open .year-arrow {
            transform: rotate(90deg);
        }
        .month-list {
            list-style: none;
            padding-left: 18px;
            margin: 4px 0 8px 0;
            border-left: 1px solid var(--border-line, #d4d4d4);
            display: none;
        }
        .year-group.open .month-list {
            display: block;
            animation: fadeIn 0.2s ease;
        }
        .month-btn {
            font-size: 0.88rem;
            padding: 5px 8px;
        }
