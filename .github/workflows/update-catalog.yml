name: Update Cartoon Catalog & SEO Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'cartoons/**'
      - 'projects/**'
      - 'scripts/build_catalog.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate catalogs, static share pages, and sitemap
        run: python3 scripts/build_catalog.py

      - name: Commit generated files if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cartoons.json projects.json sitemap.xml c/
          if [ -d p ]; then git add p/; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update catalog, share pages, and sitemap"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
