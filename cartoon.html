    <script>
        const months = {"01":"January","02":"February","03":"March","04":"April","05":"May","06":"June","07":"July","08":"August","09":"September","10":"October","11":"November","12":"December"};
        const SITE_URL = "https://ahmadqaddura.com";

        function escHtml(str) {
            return String(str || "").replace(/[&<>"']/g, m => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[m]));
        }

        function formatDate(d) {
            const p = String(d || "").split('-');
            return p.length === 3 ? `${parseInt(p[2], 10)} ${months[p[1]] || p[1]} ${p[0]}` : d;
        }

        async function init() {
            try {
                const res = await fetch("cartoons.json", { cache: "no-cache" });
                if (!res.ok) throw new Error("Catalog fetch failed");
                const list = await res.json();

                const id = new URLSearchParams(location.search).get('id');
                let idx = list.findIndex(c => c.name === id || c.base === id || c.slug === id);
                if (idx === -1) idx = 0;
                const current = list[idx];
                if (!current) return;

                // Redirect seamlessly to the dedicated static SEO/share page when available
                if (current.page) {
                    window.location.replace(current.page);
                    return;
                }

                const title = current.title || formatDate(current.date);
                const tags = Array.isArray(current.tags) ? current.tags : [];
                const desc = current.desc || "";
                const shareUrl = `${SITE_URL}/cartoon.html?id=${encodeURIComponent(current.name)}`;
                const shareText = `${title} — Cartoon by Ahmad Qaddura`;

                document.title = `${title} — Ahmad Qaddura`;
                const newer = document.getElementById('newer-link');
                const older = document.getElementById('older-link');
                if (idx > 0) newer.href = list[idx - 1].page || `cartoon.html?id=${encodeURIComponent(list[idx - 1].name)}`;
                else newer.classList.add('disabled');
                if (idx < list.length - 1) older.href = list[idx + 1].page || `cartoon.html?id=${encodeURIComponent(list[idx + 1].name)}`;
                else older.classList.add('disabled');

                document.getElementById('cartoon-content').innerHTML = `
                    <div class="cartoon-stage">
                        <img id="main-cartoon-img" src="${escHtml(current.image)}" alt="${escHtml(title)}" title="Click to zoom">
                        <span class="zoom-hint">Click image to zoom</span>
                    </div>
                    <div class="cartoon-date">${escHtml(formatDate(current.date))}</div>
                    <h2 class="cartoon-title">${escHtml(title)}</h2>
                    ${desc ? `<div class="cartoon-desc">${escHtml(desc)}</div>` : ''}
                    ${tags.length ? `<div class="tags-wrap">${tags.map(t => `<a class="tag-pill" href="gallery.html?q=${encodeURIComponent(t)}">#${escHtml(t)}</a>`).join('')}</div>` : ''}
                    <div class="cartoon-actions">
                        <a href="store.html" class="purchase-btn">Purchase / License Cartoon &rarr;</a>
                        <div class="share-bar" aria-label="Share this cartoon">
                            <span class="share-label">Share:</span>
                            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + ' ' + shareUrl)}" target="_blank" rel="noopener" class="share-btn">WhatsApp</a>
                            <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}&via=qadduracartoon" target="_blank" rel="noopener" class="share-btn">X</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}" target="_blank" rel="noopener" class="share-btn">Facebook</a>
                            <button type="button" id="copy-link-btn" class="share-btn">Copy Link</button>
                        </div>
                    </div>
                `;

                const box = document.getElementById('zoom-lightbox');
                const zImg = document.getElementById('zoom-img');
                zImg.src = current.image;
                zImg.alt = title;
                const closeZoom = () => { box.classList.remove('open'); document.body.style.overflow = ''; };
                document.getElementById('main-cartoon-img').addEventListener('click', () => { box.classList.add('open'); document.body.style.overflow = 'hidden'; });
                document.getElementById('zoom-close').addEventListener('click', closeZoom);
                box.addEventListener('click', e => { if (e.target === box) closeZoom(); });

                const copyBtn = document.getElementById('copy-link-btn');
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard?.writeText(shareUrl).then(() => {
                        copyBtn.classList.add('copied');
                        copyBtn.textContent = 'Copied ✓';
                        setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.textContent = 'Copy Link'; }, 2200);
                    });
                });

                const others = list.filter((_, i) => i !== idx).slice(0, 4);
                if (others.length) {
                    document.getElementById('more-section').style.display = 'block';
                    document.getElementById('more-grid').innerHTML = others.map(c => `
                        <a class="more-item" href="${escHtml(c.page || `cartoon.html?id=${encodeURIComponent(c.name)}`)}">
                            <img src="${escHtml(c.image)}" alt="${escHtml(c.title || c.date)}" loading="lazy">
                            <div class="more-item-title">${escHtml(c.title || formatDate(c.date))}</div>
                        </a>
                    `).join('');
                }
            } catch (e) {
                document.getElementById('cartoon-content').innerHTML = `<p style="text-align:center;">Unable to load cartoon.</p>`;
            }
        }
        init();
    </script>
