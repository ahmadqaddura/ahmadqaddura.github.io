<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Ahmad Qaddura</title>
    <meta name="description" content="Complete editorial cartoon gallery and archive by Palestinian–Swedish cartoonist Ahmad Qaddura. Browse cartoons by year or keyword.">
    <link rel="canonical" href="https://ahmadqaddura.com/gallery.html">
    <link rel="icon" type="image/png" href="avatar.png">
    <link rel="apple-touch-icon" href="avatar.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .archive-search { width: 100%; padding: 10px 12px; border: 1px solid #d4d4d4; background: #fff; font-family: inherit; font-size: 0.9rem; margin-bottom: 24px; box-sizing: border-box; }
        .archive-search:focus { outline: none; border-color: #111; }
        .year-group { margin-bottom: 6px; }
        .year-btn, .all-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; padding: 7px 8px; cursor: pointer; font-family: inherit; font-size: 0.95rem; color: #111; text-align: left; border-radius: 2px; }
        .year-btn { font-weight: 600; }
        .year-btn:hover, .all-btn:hover { background: rgba(0,0,0,0.04); }
        .year-btn.active, .all-btn.active { background: #111; color: #fff; }
        .count-badge { font-size: 0.78rem; opacity: 0.65; }

        /* Responsive Masonry Columns with Natural Proportions */
        .gallery-grid { display: flex !important; gap: 28px; align-items: flex-start; }
        .masonry-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 32px; }
        .gallery-grid .empty-state { width: 100%; padding: 48px 20px; text-align: center; border: 1px dashed #ccc; color: #666; }

        .art-card { background: transparent !important; border: none !important; padding: 0 !important; box-shadow: none !important; }
        .art-link { display: block; text-decoration: none; color: inherit; }
        .art-frame { height: auto !important; aspect-ratio: auto !important; border: none !important; background: transparent !important; padding: 0 !important; overflow: hidden; transition: box-shadow 0.25s; }
        .art-frame:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .art-frame img { width: 100%; height: auto !important; display: block; }

        .card-date { margin-top: 8px; font-size: 0.72rem; color: #777; letter-spacing: 0.03em; }
        .card-title { margin: 4px 0 5px; font-size: 1.05rem; font-weight: 700; color: #111; line-height: 1.3; }
        .card-excerpt {
            font-size: 0.86rem; color: #444; line-height: 1.45; margin: 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .read-more { display: inline-block; margin-top: 4px; font-size: 0.8rem; color: var(--accent-red); font-weight: 600; text-decoration: underline; }

        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 42px; padding-top: 24px; border-top: 1px solid #e5e5e5; }
        .page-btn { background: #fff; border: 1px solid #d4d4d4; color: #111; padding: 7px 13px; font-family: inherit; font-size: 0.88rem; cursor: pointer; transition: all 0.15s; }
        .page-btn:hover:not(:disabled) { border-color: #111; background: #f5f5f5; }
        .page-btn.active { background: #111; color: #fff; border-color: #111; }
        .page-btn:disabled { opacity: 0.35; cursor: default; }

        .clear-filter-btn {
            background: none; border: none; padding: 0; margin-left: 10px;
            font-family: inherit; font-size: 0.85rem; font-weight: 600;
            color: var(--accent-red); text-decoration: underline; cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 class="site-title"><a href="index.html">Ahmad Qaddura</a></h1>
            <p class="site-subtitle">Editorial Cartoonist &amp; Satirical Illustrator</p>
            <nav>
                <a href="index.html">Home</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="store.html">Store</a>
                <a href="about.html">About &amp; Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="archive-layout">
            <aside class="sidebar">
                <input type="text" id="archive-search" class="archive-search" placeholder="Search cartoons or tags...">
                <div class="filter-group">
                    <h3 class="filter-title">Browse by Year</h3>
                    <div id="date-tree"></div>
                </div>
            </aside>
            <div>
                <div class="section-header">
                    <h2 class="section-title" id="archive-heading">Complete Gallery</h2>
                    <span class="section-note" id="works-count">Loading works...</span>
                </div>
                <div class="gallery-grid" id="archive-grid">
                    <div class="empty-state">Loading gallery...</div>
                </div>
                <div class="pagination" id="pagination" style="display:none;"></div>
            </div>
        </div>
    </main>

    <footer>

            <div class="social-links">

                </a>

                </a>
            </div>
            &copy; 2026 Ahmad Qaddura. All rights reserved.
        </div>
    </footer>

    <script>
        const PER_PAGE = 15;
        const months = {"01":"January","02":"February","03":"March","04":"April","05":"May","06":"June","07":"July","08":"August","09":"September","10":"October","11":"November","12":"December"};

        let cartoons = [], activeFilter = "all", searchQuery = "", currentPage = 1;
        let lastPageItems = [], lastColCount = 0;

        const searchInput = document.getElementById('archive-search');
        const dateTree = document.getElementById('date-tree');
        const grid = document.getElementById('archive-grid');
        const heading = document.getElementById('archive-heading');
        const countLabel = document.getElementById('works-count');
        const paginationEl = document.getElementById('pagination');

        function escHtml(str) {
            return String(str || "").replace(/[&<>"']/g, m => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[m]));
        }

        function formatDate(d) {
            const p = String(d || "").split('-');
            if (p.length < 2) return d;
            return p[2] ? `${parseInt(p[2], 10)} ${months[p[1]] || p[1]} ${p[0]}` : `${months[p[1]] || p[1]} ${p[0]}`;
        }

        async function loadCartoons() {
            try {
                const res = await fetch("cartoons.json");
                if (!res.ok) throw new Error("Failed to load cartoons.json");
                const raw = await res.json();
                cartoons = raw.map(c => ({
                    ...c,
                    tagsText: Array.isArray(c.tags) ? c.tags.join(" ") : String(c.tags || ""),
                    descClean: String(c.desc || "").replace(/\s+/g, " ").trim(),
                    ratio: (c.width && c.height) ? (c.height / c.width) : null
                }));

                // Read optional ?q= search query (e.g., from clicking a tag pill)
                const initialQ = new URLSearchParams(location.search).get("q");
                if (initialQ) {
                    searchInput.value = initialQ;
                    searchQuery = initialQ.trim().toLowerCase();
                }

                buildDateTree();
                renderGrid();
            } catch (e) {
                grid.innerHTML = `<div class="empty-state">Unable to load gallery right now.</div>`;
            }
        }

        function buildDateTree() {
            const counts = {};
            cartoons.forEach(c => {
                const y = String(c.date || "").split('-')[0];
                if (y) counts[y] = (counts[y] || 0) + 1;
            });
            const years = Object.keys(counts).sort((a, b) => b - a);
            let html = `<button class="all-btn active" data-filter="all"><span>All Works</span><span class="count-badge">${cartoons.length}</span></button>`;
            years.forEach(y => {
                html += `<div class="year-group"><button class="year-btn" data-filter="${escHtml(y)}"><span>${escHtml(y)}</span><span class="count-badge">${counts[y]}</span></button></div>`;
            });
            dateTree.innerHTML = html;

            dateTree.querySelectorAll('button[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const f = btn.getAttribute('data-filter');
                    activeFilter = f;
                    currentPage = 1;
                    dateTree.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderGrid();
                });
            });
        }

        function getColCount() {
            if (window.innerWidth <= 580) return 1;
            if (window.innerWidth <= 900) return 2;
            return 3;
        }

        function ensureRatios(items) {
            return Promise.all(items.map(c => {
                if (c.ratio) return Promise.resolve();
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => {
                        c.ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalHeight / img.naturalWidth) : 1;
                        resolve();
                    };
                    img.onerror = () => { c.ratio = 1; resolve(); };
                    img.src = c.image;
                });
            }));
        }

        function cardHTML(c) {
            const url = c.page || `cartoon.html?id=${encodeURIComponent(c.name)}`;
            const alt = escHtml(c.title || c.date);
            return `
                <article class="art-card">
                    <a href="${escHtml(url)}" class="art-link">
                        <div class="art-frame"><img src="${escHtml(c.image)}" alt="${alt}" loading="lazy"></div>
                        <div class="card-date">${escHtml(formatDate(c.date))}</div>
                        ${c.title ? `<h3 class="card-title">${escHtml(c.title)}</h3>` : ''}
                        ${c.descClean ? `<p class="card-excerpt">${escHtml(c.descClean)}</p><span class="read-more">Read more</span>` : ''}
                    </a>
                </article>`;
        }

        function layoutMasonry(items) {
            const colCount = getColCount();
            lastColCount = colCount;
            const cols = Array.from({ length: colCount }, () => []);
            const heights = new Array(colCount).fill(0);

            items.forEach(c => {
                let shortest = 0;
                for (let i = 1; i < colCount; i++) {
                    if (heights[i] < heights[shortest]) shortest = i;
                }
                cols[shortest].push(c);
                const textWeight = (c.title ? 0.16 : 0) + (c.descClean ? 0.28 : 0) + 0.12;
                heights[shortest] += (c.ratio || 1) + textWeight;
            });

            grid.innerHTML = cols.map(col => `<div class="masonry-col">${col.map(cardHTML).join('')}</div>`).join('');
        }

        function updateHeading() {
            const baseTitle = activeFilter === 'all' ? 'Complete Gallery' : `Gallery — ${activeFilter}`;
            if (searchQuery) {
                heading.innerHTML = `${escHtml(baseTitle)} <span style="font-size:1rem;font-weight:400;color:var(--ink-gray);">(${escHtml(searchInput.value.trim())})</span><button type="button" class="clear-filter-btn" id="clear-search-btn">Clear</button>`;
                const clearBtn = document.getElementById('clear-search-btn');
                if (clearBtn) {
                    clearBtn.addEventListener('click', () => {
                        searchInput.value = "";
                        searchQuery = "";
                        currentPage = 1;
                        history.replaceState(null, "", "gallery.html");
                        renderGrid();
                    });
                }
            } else {
                heading.textContent = baseTitle;
            }
        }

        async function renderGrid() {
            updateHeading();

            const list = cartoons.filter(c => {
                const okDate = activeFilter === 'all' || String(c.date || "").startsWith(activeFilter);
                const text = `${c.title} ${c.descClean} ${c.tagsText} ${formatDate(c.date)} ${c.date}`.toLowerCase();
                return okDate && (!searchQuery || text.includes(searchQuery));
            });

            countLabel.textContent = list.length === 1 ? 'Showing 1 work' : `Showing ${list.length} works`;
            if (!list.length) {
                lastPageItems = [];
                grid.innerHTML = `<div class="empty-state">No cartoons found matching your search.</div>`;
                paginationEl.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(list.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PER_PAGE;
            const pageItems = list.slice(start, start + PER_PAGE);
            lastPageItems = pageItems;

            await ensureRatios(pageItems);
            layoutMasonry(pageItems);
            renderPagination(totalPages);
        }

        window.addEventListener('resize', () => {
            if (lastPageItems.length && getColCount() !== lastColCount) {
                layoutMasonry(lastPageItems);
            }
        });

        function renderPagination(totalPages) {
            if (totalPages <= 1) { paginationEl.style.display = 'none'; return; }
            paginationEl.style.display = 'flex';
            let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">&larr; Previous</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">Next &rarr;</button>`;
            paginationEl.innerHTML = html;

            paginationEl.querySelectorAll('button[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.getAttribute('data-page'), 10);
                    renderGrid();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        searchInput.addEventListener('input', e => {
            searchQuery = e.target.value.trim().toLowerCase();
            currentPage = 1;
            renderGrid();
        });

        loadCartoons();
    </script>
</body>
</html>
