<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Ahmad Qaddura</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .archive-search { width: 100%; padding: 10px 12px; border: 1px solid #d4d4d4; background: #fff; font-family: inherit; font-size: 0.9rem; margin-bottom: 24px; box-sizing: border-box; }
        .archive-search:focus { outline: none; border-color: #111; }
        .year-group { margin-bottom: 6px; }
        .year-btn, .month-btn, .all-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; padding: 7px 8px; cursor: pointer; font-family: inherit; font-size: 0.95rem; color: #111; text-align: left; border-radius: 2px; }
        .year-btn { font-weight: 600; }
        .year-btn:hover, .month-btn:hover, .all-btn:hover { background: rgba(0,0,0,0.04); }
        .year-btn.active, .month-btn.active, .all-btn.active { background: #111; color: #fff; }
        .year-arrow { display: inline-block; font-size: 0.75rem; margin-right: 6px; transition: transform 0.2s; }
        .year-group.open .year-arrow { transform: rotate(90deg); }
        .month-list { list-style: none; padding-left: 18px; margin: 4px 0 8px; border-left: 1px solid #d4d4d4; display: none; }
        .year-group.open .month-list { display: block; }
        .month-btn { font-size: 0.88rem; padding: 5px 8px; }
        .count-badge { font-size: 0.78rem; opacity: 0.65; }

        /* 3-Column Frameless Masonry */
        .gallery-grid { display: block !important; column-count: 3; column-gap: 26px; }
        @media (max-width: 900px) { .gallery-grid { column-count: 2; } }
        @media (max-width: 580px) { .gallery-grid { column-count: 1; } }
        .gallery-grid .empty-state { column-span: all; padding: 48px 20px; text-align: center; border: 1px dashed #ccc; color: #666; }

        .art-card { break-inside: avoid; margin-bottom: 32px; background: transparent !important; border: none !important; padding: 0 !important; box-shadow: none !important; }
        .art-link { display: block; text-decoration: none; color: inherit; }
        .art-frame { height: auto !important; aspect-ratio: auto !important; border: none !important; background: transparent !important; padding: 0 !important; overflow: hidden; transition: box-shadow 0.25s; }        .art-frame:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .art-frame img { width: 100%; height: auto !important; display: block; }

        .card-date { margin-top: 8px; font-size: 0.72rem; color: #777; letter-spacing: 0.03em; }
        .card-title { margin: 4px 0 5px; font-size: 1.05rem; font-weight: 700; color: #111; line-height: 1.3; }
        .card-excerpt {
            font-size: 0.86rem; color: #444; line-height: 1.45; margin: 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .read-more { display: inline-block; margin-top: 4px; font-size: 0.8rem; color: #111; font-weight: 600; text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="masthead-meta">Gothenburg, Sweden &bull; Official Portfolio &amp; Gallery</div>
            <h1 class="site-title"><a href="index.html">Ahmad Qaddura</a></h1>
            <p class="site-subtitle">Editorial Cartoonist &amp; Satirical Illustrator</p>
            <nav>
                <a href="index.html">Home</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="store.html">Store</a>
                <a href="about.html">About &amp; Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="archive-layout">
            <aside class="sidebar">
                <input type="text" id="archive-search" class="archive-search" placeholder="Search cartoons...">
                <div class="filter-group">
                    <h3 class="filter-title">Browse by Date</h3>
                    <div id="date-tree"></div>
                </div>
            </aside>
            <div>
                <div class="section-header">
                    <h2 class="section-title" id="archive-heading">Complete Gallery</h2>
                    <span class="section-note" id="works-count">Loading works...</span>
                </div>
                <div class="gallery-grid" id="archive-grid">
                    <div class="empty-state">Loading gallery...</div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">&copy; 2026 Ahmad Qaddura. All rights reserved.</div>
    </footer>

    <script>
        const API_URL = "https://api.github.com/repos/ahmadqaddura/ahmadqaddura.github.io/contents/cartoons";
        const IMG_EXT = /\.(webp|jpe?g|png|gif)$/i;
        const months = {"01":"January","02":"February","03":"March","04":"April","05":"May","06":"June","07":"July","08":"August","09":"September","10":"October","11":"November","12":"December"};

        let cartoons = [], activeFilter = "all", searchQuery = "";
        const dateTree = document.getElementById('date-tree');
        const grid = document.getElementById('archive-grid');
        const heading = document.getElementById('archive-heading');
        const countLabel = document.getElementById('works-count');

        function formatDate(d) {
            const p = d.split('-');
            if (p.length < 2) return d;
            return p[2] ? `${parseInt(p[2],10)} ${months[p[1]]||p[1]} ${p[0]}` : `${months[p[1]]||p[1]} ${p[0]}`;
        }

        async function loadCartoons() {
            try {
                const res = await fetch(API_URL);
                const files = await res.json();
                const txtSet = new Set(files.filter(f => /\.txt$/i.test(f.name)).map(f => f.name));

                const items = files.filter(f => f.type === "file" && IMG_EXT.test(f.name)).map(f => {
                    const base = f.name.replace(IMG_EXT, '');
                    const m = base.match(/^(\d{4}-\d{2}-\d{2})(?:[_-](.+))?$/);
                    const date = m ? m[1] : "2026-01-01";
                    const title = (m && m[2] && !/^\d+$/.test(m[2])) ? m[2].replace(/[-_]+/g,' ').trim() : "";
                    return { name: f.name, base, date, title, desc: "", tags: "", image: `cartoons/${encodeURIComponent(f.name)}` };
                });

                await Promise.all(items.map(async c => {
                    if (!txtSet.has(c.base + ".txt")) return;
                    const r = await fetch(`cartoons/${encodeURIComponent(c.base + ".txt")}`);
                    if (!r.ok) return;
                    const lines = (await r.text()).split(/\r?\n/);
                    if (lines[0]?.trim()) c.title = lines[0].trim();
                    if (lines[1]?.trim()) c.tags = lines[1].trim();
                    c.desc = lines.slice(2).join(' ').trim();
                }));

                cartoons = items.sort((a,b) => b.date.localeCompare(a.date) || b.name.localeCompare(a.name));
                buildDateTree();
                renderGrid();
            } catch (e) {
                grid.innerHTML = `<div class="empty-state">Unable to load gallery right now.</div>`;
            }
        }

        function buildDateTree() {
            const s = {};
            cartoons.forEach(c => {
                const [y, m] = c.date.split('-');
                if (!s[y]) s[y] = { count: 0, months: {} };
                s[y].count++;
                if (m) s[y].months[m] = (s[y].months[m] || 0) + 1;
            });
            const years = Object.keys(s).sort((a,b) => b - a);
            let html = `<button class="all-btn active" data-filter="all"><span>All Works</span><span class="count-badge">${cartoons.length}</span></button>`;
            years.forEach((y, i) => {
                const ms = Object.keys(s[y].months).sort((a,b) => b - a);
                html += `<div class="year-group ${i===0?'open':''}"><button class="year-btn" data-filter="${y}"><span><span class="year-arrow">&#9656;</span>${y}</span><span class="count-badge">${s[y].count}</span></button><ul class="month-list">${ms.map(m => `<li><button class="month-btn" data-filter="${y}-${m}"><span>${months[m]||m}</span><span class="count-badge">${s[y].months[m]}</span></button></li>`).join('')}</ul></div>`;
            });
            dateTree.innerHTML = html;

            dateTree.querySelectorAll('button[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const f = btn.getAttribute('data-filter');
                    if (btn.classList.contains('year-btn')) {
                        const g = btn.closest('.year-group');
                        activeFilter === f ? g.classList.toggle('open') : g.classList.add('open');
                    }
                    activeFilter = f;
                    dateTree.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    heading.textContent = f === 'all' ? 'Complete Gallery' : (f.length === 4 ? `Gallery — ${f}` : formatDate(f));
                    renderGrid();
                });
            });
        }

        function renderGrid() {
            const list = cartoons.filter(c => {
                const okDate = activeFilter === 'all' || c.date.startsWith(activeFilter);
                const text = `${c.title} ${c.desc} ${c.tags} ${formatDate(c.date)} ${c.date}`.toLowerCase();
                return okDate && (!searchQuery || text.includes(searchQuery));
            });
            countLabel.textContent = list.length === 1 ? 'Showing 1 work' : `Showing ${list.length} works`;
            if (!list.length) { grid.innerHTML = `<div class="empty-state">No cartoons found.</div>`; return; }

            grid.innerHTML = list.map(c => {
                const url = `cartoon.html?id=${encodeURIComponent(c.name)}`;
                return `
                    <article class="art-card">
                        <a href="${url}" class="art-link">
                            <div class="art-frame"><img src="${c.image}" alt="${c.title || c.date}" loading="lazy"></div>
                            <div class="card-date">${formatDate(c.date)}</div>
                            ${c.title ? `<h3 class="card-title">${c.title}</h3>` : ''}
                            ${c.desc ? `<p class="card-excerpt">${c.desc}</p><span class="read-more">Read more</span>` : ''}
                        </a>
                    </article>`;
            }).join('');
        }

        document.getElementById('archive-search').addEventListener('input', e => {
            searchQuery = e.target.value.trim().toLowerCase();
            renderGrid();
        });
        loadCartoons();
    </script>
</body>
</html>
